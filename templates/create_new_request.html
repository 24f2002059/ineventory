<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item</title>
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/add.css">
</head>

<body>

    <header class="nav">
        <div class="left">
            <img src="/static/icons/manager.png" alt="">
            <h1>Welcome {{ user.username }},</h1>
        </div>

        <ul>
            <li><a href="{{ url_for('user_dashboard', user_id=user.id) }}" class="btn btn-outline-secondary me-2">Back</a></li>
            <li class="logout"><a href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
    </header>

    <main>

        <div class="form-card">
            <h2 class="page-title">Request Product</h2>

            <form class="item-form" action="{{ url_for('create_new_request', user_id=user.id, product_id=product.id) }}" method="POST">

                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input class="form-control bg-light" type="text" value="{{ product.name }}" disabled readonly>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input class="form-control bg-light" type="text" value="{{ product.category }}" disabled readonly>
                </div>

                <div class="mb-4">
                    <label class="form-label">Quantity to Request</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-cart-plus"></i></span>
                        <input type="number" class="form-control" value="1" min="1" max="{{ product.quantity }}" name="quantity" required>
                    </div>
                    <small class="text-muted">Available stock: {{ product.quantity }} units</small>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                        Confirm Request
                    </button>
                    <a href="{{ url_for('user_dashboard', user_id=user.id) }}" class="btn btn-link text-muted mt-2">Cancel</a>
                </div>

            </form>
        </div>

    </main>

</body>

</html>
