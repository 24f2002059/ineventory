<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>update Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/add.css">
</head>

<body>

    <header class="nav">
        <div class="left">
            <img src="/static/icons/manager.png" alt="">
            <h1>Welcome Admin,</h1>
        </div>

        <ul>
            <li><a href="{{ url_for('manager') }}" class="btn btn-outline-secondary me-2">Back</a></li>
            <li class="logout"><a href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
    </header>

    <main>

        <div class="form-card">
            <h2 class="page-title">Update Product</h2>
            <form class="item-form" action="/update/{{ product.id }}" method="POST">
                
                <div class="form-group mb-3">
                    <label class="form-label">Product Name (Read Only)</label>
                    <input class="form-control bg-light" type="text" value="{{ product.name }}" disabled readonly>
                </div>

                <div class="form-group mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" class="form-control" name="category" value="{{ product.category }}" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Quantity</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-box-seam"></i></span>
                            <input type="number" class="form-control" name="quantity" value="{{product.quantity}}" min="0" required>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Price (₹)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-primary">₹</span>
                            <input type="number" class="form-control" name="amount" value="{{product.amount}}" min="0" step="0.01" required>
                        </div>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                        Update Product
                    </button>
                    <a href="{{ url_for('manager') }}" class="btn btn-link text-muted mt-2">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
