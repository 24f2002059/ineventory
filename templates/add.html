<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item</title>
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/add.css">
</head>

<body>

    <header class="nav">
        <div class="left">
            <img src="/static/icons/manager.png" alt="">
            <h1><a href="/templates/admin-dashboard.html"></a>Welcome Admin,</h1>
        </div>

        <ul>
            <li><a href="/admin-request" class="btn btn-primary">Request</a></li>
            <li class="logout"><a href="/logout">Logout</a></li>
        </ul>
    </header>

    <main>

        <div class="form-card">
            <h2 class="page-title">Add New Product</h2>

            <form class="item-form" action="/add" method="POST">
                
                <div class="form-group mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" class="form-control" placeholder="e.g. Wireless Mouse" name="name" required>
                </div>

                <div class="form-group mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" class="form-control" placeholder="e.g. Electronics" name="category" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Quantity</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-box-seam"></i></span>
                            <input type="number" class="form-control" value="1" min="1" name="quantity" required>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Price (₹)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-primary">₹</span>
                            <input type="number" class="form-control" value="0" min="0" step="0.01" name="amount" required>
                        </div>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                        Create Product
                    </button>
                    <a href="/admin-dashboard" class="btn btn-link text-muted mt-2">Cancel</a>
                </div>

            </form>
        </div>

    </main>

</body>

</html>
